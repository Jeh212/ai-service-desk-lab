[project]
name = "ai-service-desk-api"
version = "0.1.0"
description = "AI Service Desk Lab — FastAPI backend (contracts, intents, tools, evaluation)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pymongo>=4.9.0",
    "groq>=0.13.0",
    "httpx>=0.27.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "anyio>=4.6.0",
]

[project.scripts]
asdl-seed = "app.cli.seed:main"
asdl-eval = "app.cli.evaluate:main"
asdl-reset = "app.cli.reset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require a running MongoDB",
    "evals: AI behaviour evaluations (run with the mock provider by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    "B008",   # FastAPI uses function calls (Depends) in argument defaults.
    "UP042",  # (str, Enum) is intentional for clear Pydantic/JSON serialization.
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
